services:
  zerobyte:
    image: ghcr.io/nicotsx/zerobyte:v0.41
    container_name: zerobyte
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    ports:
      - "4096:4096"
    devices:
      - /dev/fuse:/dev/fuse
    env_file:
      - .env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/lib/zerobyte:/var/lib/zerobyte
      - /home/titan:/home        # Change to the path you want to back up
      - /media/backup1:/backup1  # Optional
    # - /media/backup2:/backup2  # Optional
